# ==============================================================================
# StegShield X — Render Blueprint Specification
# Automatically creates PostgreSQL DB, NestJS Backend, and Python AI Service
# ==============================================================================

services:
  # NestJS Backend Web Service
  - type: web
    name: stegshield-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install --legacy-peer-deps --include=dev && npx prisma generate && npx prisma db push --accept-data-loss && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: stegshield-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: RESET_TOKEN_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGIN
        value: "https://stegshield-x.vercel.app"
      - key: APP_URL
        value: "https://stegshield-x.vercel.app"
      - key: OAUTH_SUCCESS_URL
        value: "https://stegshield-x.vercel.app/auth/callback"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        value: "https://stegshield-backend.onrender.com/api/auth/google/callback"
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_CALLBACK_URL
        value: "https://stegshield-backend.onrender.com/api/auth/github/callback"
      - key: AI_SERVICE_URL
        value: "https://stegshield-ai-service.onrender.com"
      - key: AI_API_KEY
        value: "4a5b6c7d8e9f0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b"
      - key: AI_API_KEY_REQUIRED
        value: "true"
      - key: COOKIE_DOMAIN
        value: ".vercel.app"
      - key: SECURITY_CONTACT_EMAIL
        value: "sreekarsh44@gmail.com"
      - key: SHARING_DEFAULT_IP_RESTRICTED
        value: "false"
      - key: SHARING_DEFAULT_MAX_DOWNLOADS
        value: "10"
      - key: SHARING_DEFAULT_EXPIRY
        value: "24h"
      - key: SHARING_REQUIRE_PASSWORD
        value: "true"

  # Python FastAPI AI Microservice
  - type: web
    name: stegshield-ai-service
    env: python
    plan: free
    rootDir: ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: AI_API_KEY
        value: "4a5b6c7d8e9f0a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b"
      - key: AI_API_KEY_REQUIRED
        value: "true"
      - key: ALLOWED_ORIGINS
        value: "https://stegshield-x.vercel.app,https://stegshield-backend.onrender.com"
      - key: AI_MODEL
        value: "llama-3.3-70b-versatile"
      - key: GROQ_API_KEY
        sync: false
      - key: MAX_FILE_SIZE
        value: "50000000"

databases:
  # Free PostgreSQL Database Instance
  - name: stegshield-db
    databaseName: stegshield
    plan: free
